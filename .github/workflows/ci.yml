name: CineCue CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  server:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/cinecue_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      MOVIE_API_BASE_URL: https://streaming-availability.p.rapidapi.com
      MOVIE_API_HOST: streaming-availability.p.rapidapi.com
      MOVIE_API_KEY: ci-test-key

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: cinecue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cinecue -d cinecue"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Apply database migrations
        run: npm run prisma:deploy
        working-directory: server

      - name: Run server tests
        run: npm run test
        working-directory: server

      - name: Run server lint
        run: npm run lint
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

  client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Run client tests
        run: npm run test
        working-directory: client

      - name: Run client lint
        run: npm run lint
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client
